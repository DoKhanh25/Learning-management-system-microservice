spring.config.import=configserver:http://localhost:8888


spring.application.name=gateway-service
server.port=8090
server.servlet.context-path=/

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/CDTN-IT/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/CDTN-IT

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.client-id=back-end-microservice-client
spring.security.oauth2.client.registration.keycloak.client-secret=rgcWhOMtdh0XVSTSwIfx135n7QHgPBI1
spring.security.oauth2.client.registration.keycloak.scope=openid

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,OPTIONS,PUT,DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.default-filters[1]=AddResponseHeader=Access-Control-Allow-Origin, http://localhost:4200
spring.cloud.gateway.default-filters[2]=AddResponseHeader=Access-Control-Allow-Methods, GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.default-filters[3]=AddResponseHeader=Access-Control-Allow-Headers, *
spring.cloud.gateway.default-filters[4]=AddResponseHeader=Access-Control-Allow-Credentials, true
spring.cloud.gateway.default-filters[5]=AddResponseHeader=Access-Control-Max-Age, 1800

spring.cloud.gateway.routes[0].id=user-route
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates=Path=/user/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1]=TokenRelay=


spring.cloud.gateway.routes[1].id=course-route
spring.cloud.gateway.routes[1].uri=lb://course-service
spring.cloud.gateway.routes[1].predicates=Path=/course/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=TokenRelay=

spring.cloud.gateway.routes[2].id=discovery-service
spring.cloud.gateway.routes[2].uri=lb://discovery-service
spring.cloud.gateway.routes[2].predicates=Path=/eureka/**

spring.cloud.gateway.routes[3].id=chat-service
spring.cloud.gateway.routes[3].uri=lb://chat-service
spring.cloud.gateway.routes[3].predicates=Path=/chat/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[3].filters[1]=TokenRelay=

# Route cho WebSocket (Chat Service)
spring.cloud.gateway.routes[4].id=chat-websocket
spring.cloud.gateway.routes[4].uri=lb:ws://chat-service
spring.cloud.gateway.routes[4].predicates=Path=/chat-websocket/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[4].filters[1]=TokenRelay=


spring.cloud.gateway.routes[5].id=quiz-service
spring.cloud.gateway.routes[5].uri=lb://quiz-service
spring.cloud.gateway.routes[5].predicates=Path=/quiz/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[5].filters[1]=TokenRelay=

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

spring.main.web-application-type=reactive

keycloak.realm=CDTN-IT
keycloak.auth-server-url=http://localhost:8080
keycloak.resource=back-end-microservice-client
keycloak.credentials.secret=rgcWhOMtdh0XVSTSwIfx135n7QHgPBI1
