version: '3'
services:
  user_service_db:
    image: mysql:latest
    container_name: user_service_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456a@
      - MYSQL_DATABASE=user_service
    volumes:
      - D:/LMS-Microservice/database/user_service:/var/lib/mysql
  course_service_db:
    image: mysql:latest
    container_name: course_service_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456a@
      - MYSQL_DATABASE=course_service
    volumes:
      - D:/LMS-Microservice/database/course_service:/var/lib/mysql
  quiz_service_db:
    image: mysql:latest
    container_name: quiz_service_db
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456a@
      - MYSQL_DATABASE=quiz_service
    volumes:
      - D:/LMS-Microservice/database/quiz_service:/var/lib/mysql
  cassandra:
    image: cassandra:latest
    container_name: chat_service_db
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=lms_cluster
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - CASSANDRA_DC=datacenter1
    volumes:
      - D:/LMS-Microservice/database/chat_service:/var/lib/cassandra
    healthcheck:
      test: [ "CMD", "cqlsh", "-e", "describe keyspaces" ]
      interval: 15s
      timeout: 10s
      retries: 10