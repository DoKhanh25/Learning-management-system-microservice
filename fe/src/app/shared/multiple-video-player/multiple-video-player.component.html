<div class="video-player-container">
  <!-- Loading state -->
  <div *ngIf="loading" class="loading-container">
    <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="4"></p-progressSpinner>
    <p>Loading video...</p>
  </div>

  <!-- Video title -->
  <div *ngIf="!loading && lessonPages?.title" class="video-title">
    <h3>{{lessonPages.title}}</h3>
  </div>

  <!-- Error state -->
  <div *ngIf="!loading && errorMessage" class="error-container">
    <div class="flex flex-column align-items-center justify-content-center">
      <i class="pi pi-video-off" style="font-size: 3rem;"></i>
      <p>Video unavailable</p>
      <small>{{errorMessage}}</small>
    </div>
  </div>

  <!-- Embedded video (YouTube/Vimeo) -->
  <div *ngIf="!loading && lessonPages && isEmbeddedVideo" class="embedded-video-wrapper">
    <iframe width="100%"
            height="100%"
            [src]="safeVideoUrl"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
    </iframe>
  </div>

  <!-- Streamed video -->
  <div class="video-player-container">
    <vg-player *ngIf="!loading && lessonPages && !isEmbeddedVideo && safeVideoUrl"
    (onPlayerReady)="onPlayerReady($event)">
      <vg-overlay-play *ngIf="api" vgFor="singleVideo"></vg-overlay-play>
      <vg-buffering *ngIf="api" vgFor="singleVideo"></vg-buffering>
      <vg-controls *ngIf="api" vgFor="singleVideo">
        <vg-play-pause></vg-play-pause>
        <vg-playback-button></vg-playback-button>
        <vg-time-display vgProperty="current" vgFormat="mm:ss"></vg-time-display>
        <vg-scrub-bar>
          <vg-scrub-bar-current-time></vg-scrub-bar-current-time>
          <vg-scrub-bar-buffering-time></vg-scrub-bar-buffering-time>
        </vg-scrub-bar>
        <vg-time-display vgProperty="total" vgFormat="mm:ss"></vg-time-display>
        <vg-mute></vg-mute>
        <vg-volume></vg-volume>
        <vg-fullscreen></vg-fullscreen>
      </vg-controls>

      <video #myMedia
             id="singleVideo"
             [vgMedia]="$any(myMedia)"
             preload="auto"
             (timeupdate)="onTimeUpdate($event)"
             crossorigin>
        <source [src]="safeVideoUrl" [type]="videoType">
        Your browser does not support the video tag.
      </video>
    </vg-player>
  </div>

    <!-- Progress bar for streaming -->
    <div *ngIf="totalBytes > 0" class="stream-progress">
      <div class="progress-bar">
        <div class="progress-fill" [style.width]="(loadedBytes / totalBytes * 100) + '%'"></div>
      </div>
      <span class="progress-text">
        {{formatBytes(loadedBytes)}} / {{formatBytes(totalBytes)}}
      </span>
    </div>
  </div>
