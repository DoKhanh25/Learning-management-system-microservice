<p-toast/>
<div class="flex justify-content-left">
  <p-breadcrumb class="max-w-full" [model]="items">
    <ng-template pTemplate="item" let-item>
      <ng-container *ngIf="item.route; else elseBlock">
        <a [routerLink]="item.route" class="p-menuitem-link">
          <span [ngClass]="[item.icon ? item.icon : '', 'text-color']"></span>
          <span class="text-primary font-semibold">{{ item.label }}</span>
        </a>
      </ng-container>
      <ng-template #elseBlock>
        <a [href]="item.url">
          <span class="text-color">{{ item.label }}</span>
        </a>
      </ng-template>
    </ng-template>
  </p-breadcrumb>
</div>

<div class="container mt-3">

  <form autocomplete="off" [formGroup]="policyDetailForm">
    <div class="flex items-center gap-2 align-items-center mb-4">
      <label for="name" class="font-semibold w-8rem">Tên</label>
      <input pInputText id="name" class="flex-auto" autocomplete="off" formControlName="name"/>
    </div>
    <div class="flex items-center gap-2 align-items-center mb-4">
      <label for="description" class="font-semibold w-8rem">Mô tả</label>
      <input pInputText id="description" class="flex-auto" autocomplete="off" formControlName="description" />
    </div>
    <div class="flex items-center gap-2 align-items-center mb-4">
      <label class="font-semibold w-8rem">Vai trò</label>
      <p-button class="float-end" label="Vai trò" [outlined]="true" severity="primary" (click)="visible = true" />
    </div>
    <div class="flex items-center gap-2 align-items-center mb-4">
      <label class="font-semibold w-8rem"></label>
      <p-table [value]="selectedRoles" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
          <tr>
            <th>Tên</th>
            <th>Loại bỏ</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-role>
          <tr>
            <td>{{ role.name }}</td>
            <td>
              <p-button icon="pi pi-minus" rounded="true" size="small" severity="danger" (click)="clickRemoveRole(role.name)"/>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

  </form>
  <div class="flex items-center gap-2 align-items-center mb-4">
    <label class="font-semibold w-8rem">Logic</label>
      <div>
        <p-radioButton name="logic" value="POSITIVE" [(ngModel)]="selectedLogic" inputId="logic1"/>
        <label for="logic1" class="ml-2">Positive</label>
      </div>
      <div class="ml-2">
        <p-radioButton name="logic" value="NEGATIVE" [(ngModel)]="selectedLogic" inputId="logic2"/>
        <label for="logic2" class="ml-2">Negative</label>
      </div>
  </div>

  <div class="flex items-center gap-2 align-items-center mb-4 mt-5">
    <label class="font-semibold w-8rem"></label>
    <p-button label="Lưu" [outlined]="false" severity="primary" (click)="clickUpdate()" />
  </div>



</div>





<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '60rem' }">
  <ng-template pTemplate="header">
    <p class="inline-flex items-center uppercase justify-center gap-2 align-items-center">
      Thêm Role
    </p>
  </ng-template>

  <p-table
    #dt
    [value]="allRoles"
    [scrollable]="true"
    [paginator]="true"
    [rows]="10"
    [first]="first"
    [showCurrentPageReport]="true"
    [(selection)]="selectedAssignRole"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    (onPage)="pageChange($event)"
    [rowsPerPageOptions]="[10, 20, 30]"
    [globalFilterFields]="['name', 'description']"
  >
    <ng-template pTemplate="caption">
      <div class="flex">
        <p-iconField iconPosition="left" class="ml-auto">
          <p-inputIcon>
            <i class="pi pi-search" (click)="dt.filterGlobal(searchQuery, 'contains')"></i>
          </p-inputIcon>
          <input
            pInputText
            type="text"
            [(ngModel)]="searchQuery"
            (keydown.enter)="dt.filterGlobal(searchQuery, 'contains')"
            placeholder="Tìm kiếm"
          />
        </p-iconField>
      </div>
    </ng-template>
    <ng-template pTemplate="header" >
      <tr>
        <th style="width: 3rem"><p-tableHeaderCheckbox /></th>
        <th pSortableColumn="name" style="min-width: 200px">
          Tên vai trò <p-sortIcon field="name" />
        </th>
        <th style="min-width: 200px">Mô tả</th>
      </tr>
    </ng-template>
    <ng-template  pTemplate="body"  let-role>
      <tr>
        <td>
          <p-tableCheckbox [value]="role" />
        </td>
        <td>{{ role.name }}</td>
        <td>{{ role.description }}</td>
      </tr>
    </ng-template>
  </p-table>
  <ng-template pTemplate="footer">
    <p-button label="Lưu" [outlined]="false" severity="primary" (click)="clickAssignRole()" />
    <p-button label="Hủy" [outlined]="true" severity="secondary" (click)="visible = false" />
  </ng-template>
</p-dialog>
