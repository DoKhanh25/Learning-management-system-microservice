<p-toast/>
<div class="flex justify-content-left">
  <p-breadcrumb class="max-w-full" [model]="items">
    <ng-template pTemplate="item" let-item>
      <ng-container *ngIf="item.route; else elseBlock">
        <a [routerLink]="item.route" class="p-menuitem-link">
          <span [ngClass]="[item.icon ? item.icon : '', 'text-color']"></span>
          <span class="text-primary font-semibold">{{ item.label }}</span>
        </a>
      </ng-container>
      <ng-template #elseBlock>
        <a [href]="item.url">
          <span class="text-color">{{ item.label }}</span>
        </a>
      </ng-template>
    </ng-template>
  </p-breadcrumb>
</div>
<div class="container">
  <div class="card">
    <p-progressBar *ngIf="loading" mode="indeterminate" [style]="{ height: '6px' }">
    </p-progressBar>
    <p-table
      #dt
      [value]="roles"
      [scrollable]="true"
      [paginator]="true"
      [rows]="10"
      [first]="first"
      [showCurrentPageReport]="true"
      [(selection)]="selectedRoles"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      (onPage)="pageChange($event)"
      [rowsPerPageOptions]="[10, 20, 30]"
      [globalFilterFields]="['name', 'description']"

    >
      <ng-template pTemplate="caption">
        <div class="flex">
          <p-iconField iconPosition="left" class="ml-auto">
            <p-inputIcon>
              <i class="pi pi-search" (click)="dt.filterGlobal(searchQuery, 'contains')"></i>
            </p-inputIcon>
            <input
              pInputText
              type="text"
              [(ngModel)]="searchQuery"
              (keydown.enter)="dt.filterGlobal(searchQuery, 'contains')"
              placeholder="Tìm kiếm"
            />
          </p-iconField>
        </div>
      </ng-template>
      <ng-template pTemplate="header" >
        <tr>
          <th style="width: 3rem"><p-tableHeaderCheckbox /></th>
          <th style="min-width: 200px">id</th>
          <th pSortableColumn="name" style="min-width: 200px">
            Tên vai trò <p-sortIcon field="name" />
          </th>
          <th style="min-width: 200px">Mô tả</th>
          <th style="min-width: 100px">Hỗn hợp</th>
          <th style="min-width: 100px">Thao tác</th>
        </tr>
      </ng-template>
      <ng-template  pTemplate="body"  let-role>
        <tr>
          <td>
            <p-tableCheckbox [value]="role" />
          </td>
          <td>{{ role.id }}</td>
          <td>{{ role.name }}</td>
          <td>{{ role.description }}</td>
          <td>{{ role.isComposite == true ? "Hỗn hợp" : "Không hỗn hợp" }}</td>

          <td>
            <p-button icon="pi pi-user" rounded="true" severity="info" (onClick)="clickRoleDetail(role.name)"/>
          </td>

        </tr>
      </ng-template>
      <ng-template pTemplate="paginatorleft">
        <p-button type="button" icon="pi pi-plus" pTooltip="Tạo role" tooltipPosition="right" (onClick)="clickOpenRoleForm()"/>
      </ng-template>
      <ng-template  pTemplate="paginatorright">
        <p-button type="button" icon="pi pi-trash" pTooltip="Xóa role" tooltipPosition="left" (onClick)="clickDeleteRole()" severity="danger"/>
      </ng-template>
    </p-table>
  </div>
</div>


<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '40rem' }">
  <ng-template pTemplate="header">
    <div class="inline-flex items-center justify-center gap-2 align-items-center">

    </div>
  </ng-template>
  <span class="text-surface-500 dark:text-surface-400 block mb-4">Tạo role</span>

  <form autocomplete="off" [formGroup]="roleAddForm">
    <div class="flex items-center gap-2 align-items-center mb-4">
      <label for="name" class="font-semibold w-8rem">Tên</label>
      <input pInputText id="name" class="flex-auto" autocomplete="off" formControlName="name"/>
    </div>
    <div class="flex items-center gap-2 align-items-center mb-4">
      <label for="description" class="font-semibold w-8rem">Mô tả</label>
      <input pInputText id="description" class="flex-auto" autocomplete="off" formControlName="description" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Lưu" [outlined]="false" severity="primary" (click)="clickAddRole()" />
    <p-button label="Hủy" [outlined]="true" severity="secondary" (click)="visible = false" />
  </ng-template>
</p-dialog>
