<p-toast/>
<div class="flex justify-content-left">
  <p-breadcrumb class="max-w-full" [model]="items">
    <ng-template pTemplate="item" let-item>
      <ng-container *ngIf="item.route; else elseBlock">
        <a [routerLink]="item.route" class="p-menuitem-link">
          <span [ngClass]="[item.icon ? item.icon : '', 'text-color']"></span>
          <span class="text-primary font-semibold">{{ item.label }}</span>
        </a>
      </ng-container>
      <ng-template #elseBlock>
        <a [href]="item.url">
          <span class="text-color">{{ item.label }}</span>
        </a>
      </ng-template>
    </ng-template>
  </p-breadcrumb>
</div>

<div class="container m-4 mx-auto">

        <div class="card">
          <p-progressBar *ngIf="loading" mode="indeterminate" [style]="{ height: '6px' }">
          </p-progressBar>
          <p-table
            #dt
            [value]="resources"
            [scrollable]="true"
            [paginator]="true"
            [rows]="10"
            [first]="first"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            (onPage)="pageChange($event)"
            [rowsPerPageOptions]="[10, 20, 30]"
            [globalFilterFields]="['name', 'description']"

          >
            <ng-template pTemplate="caption">
              <div class="flex">
                <p-iconField iconPosition="left" class="ml-auto">
                  <p-inputIcon>
                    <i class="pi pi-search" (click)="dt.filterGlobal(searchQuery, 'contains')"></i>
                  </p-inputIcon>
                  <input
                    pInputText
                    type="text"
                    [(ngModel)]="searchQuery"
                    (keydown.enter)="dt.filterGlobal(searchQuery, 'contains')"
                    placeholder="Tìm kiếm"
                  />
                </p-iconField>
              </div>
            </ng-template>
            <ng-template pTemplate="header" >
              <tr>
                <th style="min-width: 200px">Tên tài nguyên</th>
                <th style="min-width: 100px">Tên hiển thị</th>
                <th style="min-width: 100px">Phạm vi có thể thực hiện</th>
              </tr>
            </ng-template>
            <ng-template  pTemplate="body"  let-resource>
              <tr>
                <td>{{ resource.name }}</td>
                <td>{{ resource.displayName }}</td>
                <td>{{ resource.scopes ? convertScopes(resource.scopes) : "" }}</td>
              </tr>
            </ng-template>
          </p-table>
        </div>


</div>
